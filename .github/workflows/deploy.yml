name: Build and Deploy

on:
  workflow_dispatch: {}

concurrency:
  group: ec2-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
  applicationfolder: spring-boot-hello-world-example

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build WAR
        working-directory: ${{ env.applicationfolder }}
        run: mvn --batch-mode clean verify
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload artifact to S3
        run: aws s3 cp "$applicationfolder/target/SpringBootHelloWorldExampleApplication.war" "s3://$S3BUCKET/SpringBootHelloWorldExampleApplication.war"

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.IAMROLE_GITHUB }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy and wait for success
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          deployment_id=$(aws deploy create-deployment \
            --application-name CodeDeployAppNameWithASG \
            --deployment-group-name CodeDeployGroupName \
            --github-location "repository=$REPOSITORY,commitId=$COMMIT_SHA" \
            --query deploymentId --output text)
          echo "Deployment: $deployment_id" >> "$GITHUB_STEP_SUMMARY"
          aws deploy wait deployment-successful --deployment-id "$deployment_id"
          aws deploy get-deployment --deployment-id "$deployment_id" \
            --query 'deploymentInfo.{ID:deploymentId,Status:status,Completed:completeTime}'
